[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphimo"
version = "0.1.0"
description = "A graphical projection and operation seam for live marimo notebooks in Zeron."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
notebook = ["marimo==0.25.2"]
dev = ["pytest>=8,<9", "ruff>=0.8", "packaging>=23"]
prototype = ["numpy", "torch"]
workbench = ["marimo==0.25.2", "websockets>=15"]

[project.scripts]
graphimo-workbench = "graphimo.workbench.server:main"

[tool.setuptools]
packages = [
    "adapter",
    "graphimo",
    "graphimo.artifacts",
    "graphimo.workbench",
    "graphimo_core",
]
package-dir = { graphimo_core = "core/graphimo_core" }

[tool.setuptools.package-data]
"graphimo.workbench" = ["*.html", "*.js", "*.css"]

[tool.marimo.runtime]
cache_cells = true

[tool.pytest.ini_options]
pythonpath = [".", "core", "addons/pytorch"]

[tool.ruff]
line-length = 100
target-version = "py311"
