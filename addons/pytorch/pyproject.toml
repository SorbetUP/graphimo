[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphimo-pytorch"
version = "0.1.0"
description = "PyTorch MetaBlock addon for Graphimo"
requires-python = ">=3.11"
dependencies = [
    "graphimo>=0.1.0,<0.2",
    "numpy>=1.24",
    "torch>=2.6",
    "torchlens==2.34.1",
]

[project.entry-points."graphimo.metablocks"]
pytorch = "graphimo_pytorch.registration:registration"

[tool.setuptools]
packages = ["graphimo_pytorch"]
